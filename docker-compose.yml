services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_FILE: /app/data/taskflow.db
    volumes:
      - taskflow-data:/app/data

  web:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    depends_on:
      - api

volumes:
  taskflow-data:
